name: Build and deploy Cutline website

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cutline-release-published]

permissions:
  contents: read

concurrency:
  group: cutline-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify core tests
        run: npm test
      - name: Configure website links
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "VITE_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "VITE_SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if RELEASE_JSON="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"; then
            LATEST_RELEASE_TAG="$(printf '%s' "$RELEASE_JSON" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { try { console.log(JSON.parse(input).tag_name || '') } catch { console.log('') } });")"
            if [[ "$LATEST_RELEASE_TAG" == "v$PACKAGE_VERSION" ]]; then
              echo "VITE_RELEASE_DOWNLOAD_BASE=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download" >> "$GITHUB_ENV"
            else
              echo "VITE_RELEASE_DOWNLOAD_BASE=" >> "$GITHUB_ENV"
              echo "Latest release ($LATEST_RELEASE_TAG) does not match app version v$PACKAGE_VERSION; keeping installers disabled until the matching release is published."
            fi
          else
            echo "VITE_RELEASE_DOWNLOAD_BASE=" >> "$GITHUB_ENV"
          fi
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
