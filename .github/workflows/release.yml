# Build versioned Windows EXE, Linux DEB/RPM/AppImage, native desktop bundles, and Android APK.
# A [build-release] commit message rebuilds the current package version; workflow_dispatch also works.
name: Build Cutline desktop installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build-release]') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
          - platform: linux
            runner: ubuntu-22.04
            command: dist:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: Package desktop app
        run: npm run ${{ matrix.command }}
      - name: Verify auto-update metadata exists
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            metadata="release/latest.yml"
          else
            metadata="release/latest-linux.yml"
          fi
          if [[ ! -s "$metadata" ]]; then
            echo "Missing auto-update metadata: $metadata" >&2
            find release -maxdepth 1 -type f -print
            exit 1
          fi
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cutline-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 10

  native-build:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build-release]') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-22.04
          - target: linux
            runner: ubuntu-22.04
          - target: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform project files
        working-directory: native_app
        run: flutter create --platforms=${{ matrix.target }} --org com.cutline --project-name cutline_native .
      - name: Set Android compile SDK to API 36
        if: matrix.target == 'android'
        working-directory: native_app
        shell: bash
        run: |
          if [[ -f android/app/build.gradle.kts ]]; then
            sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts
            grep -Eq '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36' android/app/build.gradle.kts
          elif [[ -f android/app/build.gradle ]]; then
            sed -i -E 's/^[[:space:]]*compileSdkVersion[[:space:]]+.*/    compileSdkVersion 36/' android/app/build.gradle
            grep -Eq '^[[:space:]]*compileSdkVersion[[:space:]]+36' android/app/build.gradle
          else
            echo "Flutter did not generate an Android app Gradle file" >&2
            exit 1
          fi
      - name: Resolve Flutter packages
        working-directory: native_app
        run: flutter pub get
      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: native_app
        run: flutter build apk --release
      - name: Build Linux desktop app
        if: matrix.target == 'linux'
        working-directory: native_app
        run: flutter build linux --release
      - name: Build Windows desktop app
        if: matrix.target == 'windows'
        working-directory: native_app
        run: flutter build windows --release
      - name: Package native Linux app
        if: matrix.target == 'linux'
        shell: bash
        run: tar -czf "Cutline-Native-Linux-x64.tar.gz" -C native_app/build/linux/x64/release/bundle .
      - name: Package native Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path native_app/build/windows/x64/runner/Release/* -DestinationPath Cutline-Native-Windows-x64.zip
      - name: Name Android APK
        if: matrix.target == 'android'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cp native_app/build/app/outputs/flutter-apk/app-release.apk "Cutline-${VERSION}-android.apk"
      - name: Upload native app artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-native-${{ matrix.target }}
          path: |
            Cutline-Native-Linux-x64.tar.gz
            Cutline-Native-Windows-x64.zip
            Cutline-*-android.apk
          if-no-files-found: error
          retention-days: 10

  publish:
    needs: [build, native-build]
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build-release]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Read package version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: cutline-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
      - name: Refresh the website download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=cutline-release-published
