name: Build Cutline desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
          - platform: linux
            runner: ubuntu-22.04
            command: dist:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: Package desktop app
        run: npm run ${{ matrix.command }}
      - name: Verify auto-update metadata exists
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            metadata="release/latest.yml"
          else
            metadata="release/latest-linux.yml"
          fi
          if [[ ! -s "$metadata" ]]; then
            echo "Missing auto-update metadata: $metadata" >&2
            find release -maxdepth 1 -type f -print
            exit 1
          fi
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cutline-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 10

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: cutline-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
      - name: Refresh the website download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=cutline-release-published
